[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "world-walker"
version = "0.3.0"
description = "万界·行者 World Walker — AI 驱动的文字互动游戏引擎（世界观无关规则内核 + MCP 服务器）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "badhope" }]
keywords = ["interactive-fiction", "mcp", "ai-agent", "text-game", "emergent-narrative", "rule-engine"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]

[project.scripts]
world-walker = "game_engine.engine:main"
world-walker-mcp = "game_engine.mcp_server:main"

[tool.setuptools]
# 仓库根即 game_engine 包（引擎内部统一 `import game_engine.*`）
package-dir = { "game_engine" = "." }
packages = ["game_engine", "game_engine.rules"]
